<svg width="1200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="50%" style="stop-color:#0a3d62"/>
      <stop offset="100%" style="stop-color:#00b4d8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="200" fill="url(#bg)"/>

  <!-- Wave shape at bottom -->
  <path d="M0,140 C200,180 400,110 600,150 C800,190 1000,120 1200,155 L1200,200 L0,200 Z" fill="rgba(255,255,255,0.05)"/>
  <path d="M0,160 C300,130 600,175 900,145 C1050,130 1150,165 1200,170 L1200,200 L0,200 Z" fill="rgba(255,255,255,0.05)"/>

  <!-- Name -->
  <text x="600" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="white" text-anchor="middle" filter="url(#shadow)">Preethi Dommaraju</text>

  <!-- Subtitle -->
  <text x="600" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#90e0ef" text-anchor="middle" letter-spacing="1">Data Engineer  •  AI Data Engineer  •  Big Data &amp; Cloud</text>
</svg>
